name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The JS fixture checks (chain/reducer/store mirrors) skip
      # without node; without this step the entire value of those
      # checks — drift cannot land silently — is absent from CI.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: go test ./...
      - run: go vet ./...
      - name: Gofmt gate
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Race test core packages
        run: go test -race ./internal/...
      - run: git diff --check

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/sai
