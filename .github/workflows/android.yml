name: Android

# 触发方式：
#   - 手动（Actions 页面 → Run workflow）
#   - 打 tag（v*）
#
# 不在 push 时跑：这个构建要 bind gomobile + 下 NDK，单次十几分钟，
# 平时改 Go 代码没必要每次都出包。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 只读权限就够：产物走 artifact，不改仓库、不发 Release
permissions:
  contents: read

concurrency:
  # 同一分支/tag 上重复触发时取消旧的，避免排队等十几分钟
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # ---- 环境 ----
      # go.mod 要 1.27.3，用 go-version-file 让 action 自己读，
      # 免得这里和 go.mod 各写一个版本号、改一处忘另一处。
      #
      # 不要加 check-latest：那会去取"最新补丁版"，反而可能装的不是
      # go.mod 写的那个版本，与下面 GOTOOLCHAIN=local 的假设冲突。
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android 会装 cmdline-tools 并接受 licenses。
      #
      # **不能留默认的 packages**：v3 默认是 "tools platform-tools"，
      # 但 `tools` 是老版 SDK 的 legacy 包，早已从官方仓库移除，
      # sdkmanager 会报 "Failed to find package 'tools'" 直接失败。
      # 这里只装 platform-tools（adb 等），其余按需单独装。
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: 安装 NDK
        run: |
          # gomobile 需要 NDK；默认镜像里没有，用 sdkmanager 装。
          # 版本与本地/持续集成保持一致（AGP 8.7 兼容 27.x）。
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "platforms;android-35" \
            "build-tools;34.0.0"

          # 不假设 ANDROID_SDK_ROOT 一定已导出：setup-android 设的是
          # ANDROID_HOME/ANDROID_SDK_ROOT 之一，这里两个都兜一下。
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK 目录：$SDK"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "已安装的 NDK：$(ls "$SDK/ndk")"

      - name: 安装 gomobile
        run: |
          # 版本必须和 go.mod 里的 golang.org/x/mobile 一致，
          # 否则 bind 出来的 AAR 与 gobind 生成代码不匹配。
          VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          echo "x/mobile 版本：$VERSION"
          # GOTOOLCHAIN=local：不让 go 自作主张换工具链。
          # 否则装到的是"用另一个 Go 版本编的" gomobile，与 setup-go 给的
          # 环境不一致，后面 bind 出的 AAR 可能和 gobind 生成码对不上。
          GOTOOLCHAIN=local go install "golang.org/x/mobile/cmd/gomobile@$VERSION"
          GOTOOLCHAIN=local go install "golang.org/x/mobile/cmd/gobind@$VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: |
          gomobile init
          # 不跑 `gomobile version`：它靠读模块缓存校验自身版本，
          # 在 CI 的干净环境里总报 "binary is out of date"（无害但误导）。
          # 真正能证明装对了的是下面的实际 bind。

      # ---- 版本号 ----
      # 从 tag 推导版本名，versionCode 用**日期编码**（与本地构建一致）。
      #
      # 两条约束，必须同时满足：
      #  1. versionCode 单调递增 —— Android 靠它判断能否覆盖安装，
      #     比已装的小会直接报 INSTALL_FAILED_VERSION_DOWNGRADE。
      #  2. **本地构建和 CI 构建必须可比** —— 否则"CI 出的包装不上"
      #     或者"本地包装不上"，来回踩坑。
      #
      # 所以两边用同一套编码：天数×10000 + 当天分钟数。
      # semver 只体现在 versionName（给人看的），不参与 versionCode 排序 ——
      # 否则 v0.1.8(=10800) 会比本地日期编码(约 3200000)小，装不上去。
      - name: 推导版本号
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi

          if [[ "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            # 手动触发 / 非规范 tag：用时间戳当名字，仍能看出是哪次构建
            NAME="0.1.8-dev.$(date -u +%Y%m%d.%H%M)"
            [ -n "$TAG" ] && echo "::warning::tag '$TAG' 不是 vX.Y.Z 形式，版本名降级为 $NAME"
          fi

          # 与 android/app/build.gradle.kts 的 autoVersionCode 保持同一公式。
          #
          # 注意时区：那边用的是本地时间，这里也必须用本地 —— 用 UTC 会让
          # CI 与本地在同一天算出不同的 DAYS（差一天 = 差 10000），
          # 谁大谁小就随机了。runner 默认 UTC，所以先把时区设成和开发机一致。
          export TZ=Asia/Shanghai
          DAYS=$(( ( $(date +%s) - $(date -d '2026-01-01' +%s) ) / 86400 ))
          MINUTE=$(( 10#$(date +%H) * 60 + 10#$(date +%M) ))
          CODE=$(( DAYS * 10000 + MINUTE ))

          echo "版本名：$NAME / 版本码：$CODE（DAYS=$DAYS MINUTE=$MINUTE）"
          echo "SIMPLE_AGENT_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIMPLE_AGENT_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      # ---- 签名 ----
      # 用固定 keystore 签名，否则覆盖安装会报
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE。
      #
      # AGP 默认用 ~/.android/debug.keystore，而 runner 每次都是新环境、
      # 那个文件随机生成 —— 同一份代码在 CI 和本地构建出的签名不同。
      # Secret 里放的是 base64 编码的 keystore 文件内容。
      #
      # 没有配置 Secret 时这一步跳过，退回默认（随机）签名：
      # 那样能构建出包，但装到已有 App 的手机上会因签名不符失败。
      - name: 准备签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::没有配置 ANDROID_DEBUG_KEYSTORE，将使用随机 debug 签名，装不上已有 App"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          # 传给 Gradle（见 android/app/build.gradle.kts 的 fromEnv 配置）
          echo "SIMPLE_AGENT_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "SIMPLE_AGENT_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "SIMPLE_AGENT_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "SIMPLE_AGENT_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      # 打印构建将使用的签名指纹：装不上时先对比这里和手机上已装的包。
      - name: 打印签名指纹
        run: |
          if [ -f "$RUNNER_TEMP/debug.keystore" ]; then
            keytool -list -v \
              -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -alias androiddebugkey 2>/dev/null \
              | grep -E "SHA1:|SHA256:" || true
          else
            echo "（使用随机 debug 签名，指纹每次构建都不同）"
          fi

      # ---- 构建 ----
      # 复用仓库里的脚本而不是在 yml 里重写一遍 bind + gradle：
      # 两套构建流程必然漂移（这个项目已经踩过"AAR 过期"的坑）。
      # --no-pull：CI 里已经是目标 commit
      # --no-install：没有设备可装
      - name: 构建 APK
        run: sh ./scripts/build-android.sh --no-pull --no-install

      # 校验产物签名确实是我们指定的那份（而不是 AGP 悄悄用了随机签名）
      #
      # 用 apksigner 而不是 keytool -printcert -jarfile：
      # 后者在 JDK 17 上读 APK（zip）经常直接失败（输出空），
      # 会误报成"签名不一致"。apksigner 是 Android 官方校验工具，最可靠。
      - name: 校验 APK 签名
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"

          echo "=== APK 实际签名 ==="
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "SHA-256 digest|SHA-1 digest|Signer #1 certificate DN"

          if [ -f "$RUNNER_TEMP/debug.keystore" ]; then
            # keystore 里的期望指纹（keytool 输出 SHA256，去掉冒号和小写化）
            WANT=$(keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -alias androiddebugkey 2>/dev/null \
              | grep "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
            # APK 里的实际指纹（apksigner 输出 "Signer #1 certificate SHA-256 digest: <hex>"）
            GOT=$("$APKSIGNER" verify --print-certs "$APK" \
              | grep "SHA-256 digest" | head -1 | sed 's/.*digest: *//' | tr -d ': ' | tr 'A-F' 'a-f')

            echo ""
            echo "期望 SHA-256: $WANT"
            echo "实际 SHA-256: $GOT"
            if [ "$WANT" != "$GOT" ]; then
              echo "::error::APK 签名与指定 keystore 不一致，装到手机上会签名冲突"
              exit 1
            fi
            echo "签名一致 ✓"
          fi

      # 脚本里已接 check-16kb.py 自检（Android 15+ 的 16KB 页要求）。
      # 这里再独立跑一次并留档，便于在 Actions 页面直接看到结果。
      - name: 16 KB 对齐检查
        run: python3 scripts/check-16kb.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: 汇总
        run: |
          APK=build/app-debug.apk
          # 从产物里读出真实版本号，确认版本号确实写进去了
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -1)
          VERSION=$("$AAPT2" dump badging "$APK" 2>/dev/null \
            | grep -o "versionName='[^']*'" | head -1 || true)
          echo "### Android 构建成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：${SIMPLE_AGENT_VERSION_NAME:-?}（versionCode ${SIMPLE_AGENT_VERSION_CODE:-?}）" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK 大小：$(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit：\`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 16 KB 对齐：通过" >> "$GITHUB_STEP_SUMMARY"
          echo "- 签名：与 mini 一致" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "APK 内实际版本：$VERSION"
          echo "（应为 versionName='${SIMPLE_AGENT_VERSION_NAME}' - 不一致说明环境变量没传进 Gradle）"

      - uses: actions/upload-artifact@v5
        with:
          # 名字里带版本号：下载列表里一眼能认出是哪个版本
          name: simple-agent-${{ env.SIMPLE_AGENT_VERSION_NAME }}-${{ github.sha }}
          path: build/app-debug.apk
          if-no-files-found: error
          # debug 包带调试符号，体积偏大；保留 14 天够用
          retention-days: 14